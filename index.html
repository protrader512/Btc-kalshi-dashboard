<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#071018">
<title>BTC 15M PRO</title>

<style>
:root{
--bg:#071018;
--card:#101923;
--line:#22313f;
--text:#f4f7fb;
--muted:#91a0af;
--good:#45d483;
--bad:#ff6875;
--warn:#ffc857;
--blue:#72a7ff
}

*{box-sizing:border-box}

body{
margin:0;
background:var(--bg);
color:var(--text);
font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif
}

.app{
max-width:760px;
margin:auto;
padding:14px
}

header{
padding:8px 2px 14px
}

.brand{
font-size:25px;
font-weight:900
}

.tag,.sub{
color:var(--muted);
font-size:12px
}

.card{
background:var(--card);
border:1px solid var(--line);
border-radius:17px;
padding:14px;
margin-bottom:11px
}

.timer{
display:flex;
justify-content:space-between;
align-items:center
}

.timer .value{
font-size:34px;
font-weight:900
}

.pill{
padding:6px 9px;
border-radius:999px;
background:#0c151e;
border:1px solid var(--line);
font-size:11px;
color:var(--muted)
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px
}

label{
font-size:11px;
color:var(--muted);
display:block;
margin-bottom:5px
}

input{
width:100%;
background:#0c151e;
border:1px solid var(--line);
color:var(--text);
border-radius:10px;
padding:12px;
font-size:16px
}

button{
border:0;
border-radius:11px;
padding:12px 14px;
font-weight:850;
font-size:15px;
background:var(--blue);
color:#071018;
width:100%
}

.btn2{
background:#0c151e;
border:1px solid var(--line);
color:var(--text)
}

.decision{
text-align:center;
font-size:39px;
font-weight:950
}

.good{color:var(--good)}
.bad{color:var(--bad)}
.warnc{color:var(--warn)}

.center{text-align:center}

.metrics{
display:grid;
grid-template-columns:1fr 1fr 1fr;
gap:8px;
margin-top:10px
}

.metric{
background:#0c151e;
border:1px solid var(--line);
border-radius:12px;
padding:10px
}

.metric b{
display:block;
font-size:20px;
margin-top:3px
}

.metric span{
font-size:10px;
color:var(--muted)
}

.row{
display:flex;
justify-content:space-between;
padding:9px 0;
border-bottom:1px solid var(--line);
font-size:13px
}

.row:last-child{
border:0
}

.bar{
height:10px;
background:#0c151e;
border-radius:99px;
overflow:hidden;
border:1px solid var(--line);
margin:9px 0
}

.fill{
height:100%;
width:50%;
background:var(--blue);
transition:.25s
}

.actions{
display:grid;
grid-template-columns:1fr 1fr;
gap:9px
}

.small{
font-size:11px;
color:var(--muted);
line-height:1.45
}

table{
width:100%;
border-collapse:collapse;
font-size:11px
}

td,th{
text-align:left;
padding:7px 4px;
border-bottom:1px solid var(--line)
}

th{
color:var(--muted)
}

.install{
background:#0c151e;
border:1px solid var(--line);
border-radius:12px;
padding:10px;
font-size:12px
}

@media(max-width:520px){
.grid{
grid-template-columns:1fr
}

.timer .value{
font-size:31px
}
}
</style>
</head>

<body>

<div class="app">

<header>
<div class="brand">₿ BTC 15M PRO</div>
<div class="tag">15-minute contract decision dashboard</div>
</header>


<div class="card">

<div class="timer">

<div>
<div class="sub">TIME REMAINING</div>
<div id="clock" class="value">15:00</div>
</div>

<div class="pill">MANUAL MODE</div>

</div>

</div>


<div class="card">

<div class="grid">

<div>
<label>Current BTC price ($)</label>
<input id="btc" type="number" step=".01">
</div>

<div>
<label>Contract target ($)</label>
<input id="target" type="number" step=".01">
</div>

<div>
<label>UP price (¢)</label>
<input id="up" type="number" min="1" max="99">
</div>

<div>
<label>DOWN price (¢)</label>
<input id="down" type="number" min="1" max="99">
</div>

<div>
<label>Minutes remaining</label>
<input id="mins" type="number" min="0" max="15" step=".1">
</div>

<div>
<label>Volatility % / hour</label>
<input id="vol" type="number" min=".1" step=".1" value="3">
</div>

<div>
<label>Bankroll ($)</label>
<input id="bank" type="number" min="0" step="1">
</div>

<div>
<label>Max risk per trade
